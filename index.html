<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#090b0a" />
    <meta name="description" content="BLACKSITE: FRONTLINE DESCENT — an original first-person sci-fi military operation sandbox." />
    <meta property="og:title" content="BLACKSITE: FRONTLINE DESCENT" />
    <meta property="og:description" content="Deploy from ASC Valiant, dismantle hostile infrastructure, and extract under fire." />
    <title>BLACKSITE: FRONTLINE DESCENT</title>
    <script>
      (function() {
        try {
          var originalFetch = window.fetch;
          var customFetch = originalFetch;
          Object.defineProperty(window, 'fetch', {
            get: function() {
              return customFetch;
            },
            set: function(val) {
              customFetch = val;
            },
            configurable: true,
            enumerable: true
          });
        } catch (e) {
          console.warn('Could not define custom fetch setter:', e);
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
